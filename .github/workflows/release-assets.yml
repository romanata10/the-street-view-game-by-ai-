name: Release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag (for example, v1.0.0)
        required: true
        type: string
  repository_dispatch:
    types: [build-release-assets]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A semantic release tag is required (for example, v1.0.0)"
            exit 1
          fi
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.client_payload.tag }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate and build
        run: |
          npm run test:content
          npm run build
      - name: Package production bundle
        env:
          TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: |
          VERSION="${TAG#v}"
          ARCHIVE="geosvoi-${VERSION}-production.tar.gz"
          ZIP="geosvoi-${VERSION}-production.zip"
          STAGING=".release/geosvoi-${VERSION}"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          mkdir -p "$STAGING"
          cp -r dist server shared package.json package-lock.json .env.example \
            README.md CHANGELOG.md THIRD_PARTY_NOTICES.md docs "$STAGING/"
          tar -czf "$ARCHIVE" -C .release "geosvoi-${VERSION}"
          (cd .release && zip -qr "../$ZIP" "geosvoi-${VERSION}")
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          sha256sum "$ZIP" > "$ZIP.sha256"
      - name: Upload production archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: gh release upload "$TAG" "$ARCHIVE" --clobber
      - name: Upload production ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: gh release upload "$TAG" "$ZIP" --clobber
      - name: Upload TAR.GZ SHA-256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: gh release upload "$TAG" "$ARCHIVE.sha256" --clobber
      - name: Upload ZIP SHA-256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: gh release upload "$TAG" "$ZIP.sha256" --clobber
